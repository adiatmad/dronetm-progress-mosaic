name: Windows desktop executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Install app and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build single-file executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name DroneTM-Progress-Mosaic --add-data "app.py;." --add-data "mosaic_core.py;." --collect-all streamlit --collect-all rasterio --collect-all numpy --collect-all pandas --collect-all PIL --collect-all altair --collect-all pydeck --collect-all watchdog --collect-all tornado --collect-all requests --copy-metadata streamlit --copy-metadata rasterio --copy-metadata pandas --copy-metadata numpy --copy-metadata requests desktop_launcher.py

      - name: Smoke-test executable startup
        shell: pwsh
        run: |
          if (!(Test-Path "dist/DroneTM-Progress-Mosaic.exe")) { throw "PyInstaller did not produce the expected executable." }
          $item = Get-Item "dist/DroneTM-Progress-Mosaic.exe"
          if ($item.Length -lt 10000000) { throw "Executable is unexpectedly small ($($item.Length) bytes)." }
          Get-FileHash "dist/DroneTM-Progress-Mosaic.exe" -Algorithm SHA256 | Format-List
          & $item.FullName --help
          if ($LASTEXITCODE -ne 0) { throw "Executable startup smoke test failed with exit code $LASTEXITCODE." }

      - name: Smoke-test bundled executable
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "mosaic-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "mosaic-stderr.log"
          $process = Start-Process -FilePath "dist/DroneTM-Progress-Mosaic.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match "ok") { $healthy = $true; break }
              } catch {}
            }
            if (!$healthy) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Bundled executable did not serve the Streamlit health endpoint."
            }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneTM-Progress-Mosaic-Windows-x64
          path: dist/DroneTM-Progress-Mosaic.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach executable to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DroneTM-Progress-Mosaic.exe
          fail_on_unmatched_files: true
